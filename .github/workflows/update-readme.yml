name: Update workshop profile

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: profile-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.PROFILE_STATS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the stats generator
        run: python -m unittest discover -s tests -v
      - name: Refresh public contribution data and workshop images
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'PROFILE_STATS_TOKEN is required to include owner-visible private PR and commit totals.'
            exit 1
          fi
          python scripts/update_profile.py
      - name: Commit the refreshed files
        run: |
          git add README.md data/profile-stats.json assets/work-log*.svg assets/lifetime*.svg
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh workshop activity and contribution status'
          git push
